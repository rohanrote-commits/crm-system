spring.application.name=crm-system-backend
spring.datasource.url=jdbc:mysql://localhost:3306/crmdb?useSSL=false&allowPublicKeyRetrieval=true


# Database credentials
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Spring Mail Settings
spring.mail.host=smtp.gmail.com
# Connect to the email server using Port 587.
# This is a standard port for secure email communication.
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
# Start the connection normally, but immediately request to upgrade the connection to be
# secure (using TLS/SSL encryption)
spring.mail.properties.mail.smtp.starttls.enable=true

# Custom Scheduler Settings
report.sender.email=
report.recipient.email=


#loging configuration
#logging.file.name=crm-app.log
#logging.file.path=logs/
#logging.logback.rollingpolicy.max-file-size=10MB
#logging.logback.rollingpolicy.max-history=7


spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp


